version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: devweb_mysql_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webapp_db}
      MYSQL_USER: ${MYSQL_USER:-webapp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webapp_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: devweb_server_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-webapp_user}:${MYSQL_PASSWORD:-webapp_password}@mysql:3306/${MYSQL_DATABASE:-webapp_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173}
    ports:
      - "3000:3000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: devweb_client_prod
    restart: unless-stopped
    depends_on:
      - server
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "4173:4173"

volumes:
  mysql_data:
